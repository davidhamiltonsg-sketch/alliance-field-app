<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512" role="img" aria-label="THE ALLIANCE mark">
  <title>THE ALLIANCE</title>
  <!-- Peak-and-wave alliance mark: two rising strokes meeting at a peak over
       a soft double-arch wave. Accent #2C3E2D legs, warm tan #A8895A wave —
       the two-tone treatment used on paper backgrounds. -->
  <g fill="none" stroke-linecap="round">
    <path d="M60 14L26 106" stroke="#2C3E2D" stroke-width="10"/>
    <path d="M60 14L94 106" stroke="#2C3E2D" stroke-width="10"/>
    <path d="M40 74Q50 63 60 74Q70 63 80 74" stroke="#A8895A" stroke-width="8.5"/>
  </g>
</svg>
